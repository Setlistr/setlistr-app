<title>Before Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600;9..40,800&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap">
<style>
/* Layout: a phone-width app frame (Setlistr's dark system) centred on a quiet stage; scenario switch above it, notes beside it on wide screens. Single dark world by choice, like the app. */
:root {
  color-scheme: dark;
  --bg: #0a0908; --card: #141210; --card-2: #1b1815; --line: #2a2620; --gold: #c9a84c; --gold-soft: #2a2416;
  --cream: #f0ece3; --sand: #b8a888; --muted: #8f8473; --dim: #5a5448;
  --ok: #4ade80; --warn: #f59e0b; --info: #60a5fa; --bad: #f87171;
  --sans: "DM Sans", system-ui, -apple-system, sans-serif; --serif: "DM Serif Display", Georgia, serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --orb: radial-gradient(circle at 40% 35%, #e8c76a, #c9a84c 55%, #a07828);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--cream); }
body { font: 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 24px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.top { max-width: 1060px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.top h1 { font: 400 30px/1.1 var(--serif); margin: 0; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--sand); font-size: 13px; max-width: 60ch; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--sand); min-height: 36px; }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--cream); background: var(--gold-soft); }
.stage { max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.phone { background: var(--bg); border: 1px solid var(--line); border-radius: 34px; padding: 14px 0 0; min-height: 760px; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.steps { display: flex; gap: 4px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.steps button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 40px; }
.steps button[aria-current="step"] { color: var(--gold); border-bottom-color: var(--gold); }
.screen { padding: 18px 18px 28px; display: grid; gap: 14px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
h2 { font: 400 28px/1.1 var(--serif); margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sand); margin: 0; }
.sub { color: var(--sand); font-size: 14px; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.basis { font: 12px/1.45 var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--sand); white-space: nowrap; }
.pill.gold { border-color: #c9a84c66; color: var(--gold); }
.pill.warn { border-color: #f59e0b66; color: var(--warn); }
.pill.info { border-color: #60a5fa55; color: var(--info); }
.songs { list-style: none; margin: 0; padding: 0; display: grid; }
.songs li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.songs li:first-child { border-top: 0; }
.songs .n { font: 12px var(--mono); color: var(--dim); width: 18px; flex: none; text-align: right; }
.songs .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.btn { background: var(--gold); color: #1a1408; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; min-height: 48px; width: 100%; }
.btn[disabled] { background: var(--card-2); color: var(--dim); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); font-weight: 600; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 > * { flex: 1 1 120px; }
.chip { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; min-height: 44px; }
.chip small { color: var(--muted); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tonight { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid #c9a84c55; border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%; }
.tonight .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orb); flex: none; box-shadow: 0 0 12px #c9a84c80; }
.q { background: var(--card-2); border: 1px solid #f59e0b44; border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.q.done { border-color: var(--line); }
.q p { margin: 0; font-size: 14px; }
.opt { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
.photo { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1100 / 1466; max-height: 360px; margin: 0 auto; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan { position: absolute; left: 0; right: 0; height: 22%; background: linear-gradient(to bottom, transparent, #c9a84c40, transparent); animation: scan 1.1s ease-in-out infinite; }
@keyframes scan { from { top: -22%; } to { top: 100%; } }
.record { display: grid; gap: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #c9a84c99; display: block; }
.dots i.gap { background: transparent; border: 1.5px dashed var(--dim); }
.dots i.new { background: var(--orb); box-shadow: 0 0 10px #c9a84c; }
.count { font: 400 40px/1 var(--serif); }
.orb { position: fixed; width: 110px; height: 110px; border-radius: 50%; background: var(--orb); box-shadow: 0 0 60px #c9a84c80, 0 0 120px #c9a84c30; pointer-events: none; z-index: 40; opacity: 0; }
.disc { border-left: 2px solid var(--gold); padding-left: 12px; display: grid; gap: 4px; }
.disc b { font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; min-height: 28px; display: flex; align-items: center; }
.tour { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.night { border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 11px; display: grid; gap: 2px; background: var(--card-2); min-width: 0; }
.night b { font-size: 12px; overflow-wrap: break-word; hyphens: auto; }
.night.gap { border-style: dashed; color: var(--muted); background: transparent; }
.night.now { border-color: var(--gold); }
.night.next { opacity: .6; }
.notes { display: grid; gap: 14px; font-size: 14px; color: var(--sand); max-width: 62ch; }
.notes h3 { color: var(--cream); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes .src { font: 12px var(--mono); color: var(--muted); }
.banner { background: #2b1f10; border: 1px solid #f59e0b55; border-radius: 14px; padding: 12px; display: grid; gap: 8px; font-size: 14px; }
.toast { font-size: 13px; color: var(--ok); }
.flash { animation: flash .6s ease-out; }
@keyframes flash { from { background: var(--gold-soft); } }
@media (prefers-reduced-motion: reduce) { .scan, .flash { animation: none; } }
</style>

<div class="top">
  <div>
    <h1>Before tonight, and the morning after</h1>
    <p>An interactive prototype with a synthetic example artist. The setlist photos and their reading come from the local benchmark run (<span id="srcLabel"></span>). Nothing here touches Setlistr's data.</p>
  </div>
  <div class="seg" role="group" aria-label="Scenario">
    <button id="sc-rich" aria-pressed="true">34 shows on record</button>
    <button id="sc-low" aria-pressed="false">New to Setlistr (3 shows)</button>
    <button id="sc-gap" aria-pressed="false">Missing evidence</button>
  </div>
</div>

<div class="stage">
  <div class="phone" aria-label="Phone prototype">
    <nav class="steps" aria-label="Journey">
      <button id="st-before" aria-current="step">Before tonight</button>
      <button id="st-after">After the show</button>
      <button id="st-confirm">Confirm</button>
      <button id="st-reward">Your record</button>
    </nav>
    <div id="screen" class="screen"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="orb" id="orb" aria-hidden="true"></div>

  after: `<h3>After the show</h3><ul><li>One photo of the sheet already in use. The reading shown is the benchmark's actual output for this image.</li><li>Unreadable photos fail plainly: retake or type, with no staff queue. The "Missing evidence" scenario uses a real unreadable benchmark photo and its retake.</li></ul>`,
  confirm: `<h3>Confirm</h3><ul><li>"Did this show happen?" always comes first. A booking or photo isn't proof.</li><li>Only flagged lines ask a question: crossed out, added by hand, hard to read, a new song, or an ambiguous title. Everything else is pre-filled.</li><li>"Played in this order?" decides whether position claims are allowed.</li><li>Off-paper changes (an unlisted song, an unmarked skip) can only come from the person confirming.</li></ul>`,
  reward: `<h3>Your record</h3><ul><li>The shipped celebration's motion: the orb lands as a new dot on the record.</li><li>At most three discoveries, each with its basis. None are generated by AI text; all are computed from confirmed nights.</li><li>Gaps stay visible in the run. Prepare is offered, and filing stays the artist's.</li><li>No royalty figures.</li></ul>`,
}
function render() {
  ['rich', 'low', 'gap'].forEach(k => $('#sc-' + k).setAttribute('aria-pressed', S.scenario === k))
  ;['before', 'after', 'confirm', 'reward'].forEach(k => S.step === k ? $('#st-' + k).setAttribute('aria-current', 'step') : $('#st-' + k).removeAttribute('aria-current'))
  ;({ before: beforeScreen, after: afterScreen, confirm: confirmScreen, reward: rewardScreen })[S.step]()
  $('#notes').innerHTML = NOTES[S.step] + `<p class="src">${DATA.benchNote}</p>`
}
render()
</script>
