<title>Before Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600;9..40,800&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap">
<style>
/* Layout: a phone-width app frame (Setlistr's dark system) centred on a quiet stage; scenario switch above it, notes beside it on wide screens. Single dark world by choice, like the app. */
:root {
  color-scheme: dark;
  --bg: #0a0908; --card: #141210; --card-2: #1b1815; --line: #2a2620; --gold: #c9a84c; --gold-soft: #2a2416;
  --cream: #f0ece3; --sand: #b8a888; --muted: #8f8473; --dim: #5a5448;
  --ok: #4ade80; --warn: #f59e0b; --info: #60a5fa; --bad: #f87171;
  --sans: "DM Sans", system-ui, -apple-system, sans-serif; --serif: "DM Serif Display", Georgia, serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --orb: radial-gradient(circle at 40% 35%, #e8c76a, #c9a84c 55%, #a07828);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--cream); }
body { font: 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 24px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.top { max-width: 1060px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.top h1 { font: 400 30px/1.1 var(--serif); margin: 0; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--sand); font-size: 13px; max-width: 60ch; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--sand); min-height: 36px; }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--cream); background: var(--gold-soft); }
.stage { max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.phone { background: var(--bg); border: 1px solid var(--line); border-radius: 34px; padding: 14px 0 0; min-height: 760px; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.steps { display: flex; gap: 4px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.steps button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-height: 40px; }
.steps button[aria-current="step"] { color: var(--gold); border-bottom-color: var(--gold); }
.screen { padding: 18px 18px 28px; display: grid; gap: 14px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
h2 { font: 400 28px/1.1 var(--serif); margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sand); margin: 0; }
.sub { color: var(--sand); font-size: 14px; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.basis { font: 12px/1.45 var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--sand); white-space: nowrap; }
.pill.gold { border-color: #c9a84c66; color: var(--gold); }
.pill.warn { border-color: #f59e0b66; color: var(--warn); }
.pill.info { border-color: #60a5fa55; color: var(--info); }
.songs { list-style: none; margin: 0; padding: 0; display: grid; }
.songs li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.songs li:first-child { border-top: 0; }
.songs .n { font: 12px var(--mono); color: var(--dim); width: 18px; flex: none; text-align: right; }
.songs .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.btn { background: var(--gold); color: #1a1408; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; min-height: 48px; width: 100%; }
.btn[disabled] { background: var(--card-2); color: var(--dim); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); font-weight: 600; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 > * { flex: 1 1 120px; }
.chip { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; min-height: 44px; }
.chip small { color: var(--muted); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tonight { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid #c9a84c55; border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%; }
.tonight .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orb); flex: none; box-shadow: 0 0 12px #c9a84c80; }
.q { background: var(--card-2); border: 1px solid #f59e0b44; border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.q.done { border-color: var(--line); }
.q p { margin: 0; font-size: 14px; }
.opt { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
.photo { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1100 / 1466; max-height: 360px; margin: 0 auto; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan { position: absolute; left: 0; right: 0; height: 22%; background: linear-gradient(to bottom, transparent, #c9a84c40, transparent); animation: scan 1.1s ease-in-out infinite; }
@keyframes scan { from { top: -22%; } to { top: 100%; } }
.record { display: grid; gap: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #c9a84c99; display: block; }
.dots i.gap { background: transparent; border: 1.5px dashed var(--dim); }
.dots i.new { background: var(--orb); box-shadow: 0 0 10px #c9a84c; }
.count { font: 400 40px/1 var(--serif); }
.orb { position: fixed; width: 110px; height: 110px; border-radius: 50%; background: var(--orb); box-shadow: 0 0 60px #c9a84c80, 0 0 120px #c9a84c30; pointer-events: none; z-index: 40; opacity: 0; }
.disc { border-left: 2px solid var(--gold); padding-left: 12px; display: grid; gap: 4px; }
.disc b { font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; min-height: 28px; display: flex; align-items: center; }
.tour { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.night { border: 1px solid var(--line); border-radius: 10px; padding: 6px; font-size: 11px; display: grid; gap: 2px; background: var(--card-2); min-width: 0; }
.night b { font-size: 12px; overflow-wrap: break-word; hyphens: auto; }
.night.gap { border-style: dashed; color: var(--muted); background: transparent; }
.night.now { border-color: var(--gold); }
.night.next { opacity: .6; }
.notes { display: grid; gap: 14px; font-size: 14px; color: var(--sand); max-width: 62ch; }
.notes h3 { color: var(--cream); }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes .src { font: 12px var(--mono); color: var(--muted); }
.banner { background: #2b1f10; border: 1px solid #f59e0b55; border-radius: 14px; padding: 12px; display: grid; gap: 8px; font-size: 14px; }
.toast { font-size: 13px; color: var(--ok); }
.flash { animation: flash .6s ease-out; }
@keyframes flash { from { background: var(--gold-soft); } }
@media (prefers-reduced-motion: reduce) { .scan, .flash { animation: none; } }
</style>

<div class="top">
  <div>
    <h1>Before tonight, and the morning after</h1>
    <p>An interactive prototype with a synthetic example artist. The setlist photos and their reading come from the local benchmark run (<span id="srcLabel"></span>). Nothing here touches Setlistr's data.</p>
  </div>
  <div class="seg" role="group" aria-label="Scenario">
    <button id="sc-rich" aria-pressed="true">34 shows on record</button>
    <button id="sc-low" aria-pressed="false">New to Setlistr (3 shows)</button>
    <button id="sc-gap" aria-pressed="false">Missing evidence</button>
  </div>
</div>

<div class="stage">
  <div class="phone" aria-label="Phone prototype">
    <nav class="steps" aria-label="Journey">
      <button id="st-before" aria-current="step">Before tonight</button>
      <button id="st-after">After the show</button>
      <button id="st-confirm">Confirm</button>
      <button id="st-reward">Your record</button>
    </nav>
    <div id="screen" class="screen"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="orb" id="orb" aria-hidden="true"></div>

<script>
const DATA = /*__DATA__*/null
const $ = s => document.querySelector(s)
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
document.getElementById('srcLabel').textContent = DATA.source

// ── The example artist's record (synthetic). Every insight below is computed from it. ──
const SONGS = ['Neon Lights','Old Favourite','Harbour','June','Home','Home Again','Paper Moon Motel','Glasshouse','Small Hours','Northbound','Ribbon','Static Bloom','Saint Agnes','Low Tide','The Long Way Round','Wildfire Season','Copper','Undertow','Late Bloomer','Kite String','Dreams','Sparrow','Blue Hour','Parking Lot Prayer','Lighthouse Keeper','Marigold','Ferris Wheel','Jolene','Landslide','Hallelujah']
function rng(seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647 }
const CITIES = [['Chicago','Thalia Hall'],['Madison','High Noon'],['Denver','The Bluebird'],['Austin','Mohawk'],['Nashville','Mercy Lounge'],['Atlanta','Terminal West'],['Toronto',"Lee's Palace"],['Seattle','Neumos'],['Portland','Doug Fir'],['New York','Rough Trade'],['Cambridge','The Sinclair'],['Washington','Black Cat']]
function day(d, n) { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10) }
function fmt(d, y) { return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', ...(y ? { year: 'numeric' } : {}) }) }

function buildRecord(kind) {
  const r = rng(kind === 'low' ? 11 : 7), shows = []
  const pick = (n, bias) => { const pool = [...SONGS]; const out = []; while (out.length < n) { const s = pool.splice(Math.floor(r() * pool.length), 1)[0]; if (!bias || !bias.includes(s) || r() < 0.35) out.push(s) } return out }
  const add = (date, city, venue, songs, opts = {}) => shows.push({ date, city, venue, songs, order: !!opts.order, source: opts.source || 'live', setlist: songs !== null })
  if (kind === 'low') {
    add('2026-10-24', 'Madison', 'High Noon', pick(11), { order: true })
    add('2026-10-27', 'Chicago', 'Thalia Hall', pick(12), { source: 'photo' })
    add('2026-10-29', 'Milwaukee', 'Pabst Theater', pick(12), { order: true })
    return shows
  }
  // Two earlier years of shows, one setlist each; a few nights left without a setlist.
  let d = '2024-09-06'
  for (let i = 0; i < 26; i++) { const [c, v] = CITIES[i % CITIES.length]; d = day(d, 14 + Math.floor(r() * 30)); add(d, c, v, pick(11 + Math.floor(r() * 4), ['Harbour', 'June']), { order: r() < 0.6, source: r() < 0.6 ? 'live' : 'photo' }) }
  // Minneapolis on the record: one live capture (order reliable) and, in the missing-evidence case, a night with no setlist.
  add('2025-09-18', 'Minneapolis', 'First Avenue', ['Low Tide','Old Favourite','Harbour','Neon Lights','June','Northbound','Static Bloom','Kite String','Saint Agnes','Dreams','Copper','Wildfire Season','Lighthouse Keeper'], { order: true })
  if (kind === 'gap') add('2024-11-02', 'Minneapolis', 'First Avenue', null)
  // The fall run so far.
  const run = [['2026-10-09','Chicago','Thalia Hall'],['2026-10-11','Madison','High Noon'],['2026-10-14','Denver','The Bluebird'],['2026-10-17','Austin','Mohawk'],['2026-10-20','Nashville','Mercy Lounge'],['2026-10-23','Atlanta','Terminal West'],['2026-10-26','Toronto',"Lee's Palace"],['2026-10-29','Milwaukee','Pabst Theater']]
  run.forEach(([dt, c, v], i) => {
    const missing = dt === '2026-10-14' || (kind === 'gap' && dt === '2026-10-29')
    add(dt, c, v, missing ? null : pick(12 + (i % 3), ['Harbour', 'June', 'Low Tide']).concat(i > 3 ? ['Marigold'] : []), { order: i % 2 === 0, source: i % 3 ? 'photo' : 'live' })
  })
  return shows.sort((a, b) => a.date.localeCompare(b.date))
}
const RUN_DATES = ['2026-10-09','2026-10-11','2026-10-14','2026-10-17','2026-10-20','2026-10-23','2026-10-26','2026-10-29']

// ── Insights, each with its own evidence requirement (docs/experience-strategy-update.md §6). ──
const confirmed = rec => rec.filter(s => s.setlist)
function gapFreeRun(rec) { const out = []; for (let i = rec.length - 1; i >= 0; i--) { if (!rec[i].setlist) break; out.push(rec[i]) } return out } // newest first
function cityNights(rec, city) { return rec.filter(s => s.city === city) }
function insights(rec, city) {
  const nights = cityNights(rec, city), withSet = nights.filter(s => s.setlist), last = withSet[withSet.length - 1]
  const cityComplete = nights.length > 0 && nights.every(s => s.setlist)
  const run = gapFreeRun(rec), K = run.length
  const out = { city, nights, withSet, last, cityComplete, K, total: confirmed(rec).length, gaps: rec.filter(s => !s.setlist).length }
  if (last) {
    out.notSince = last.songs.filter(s => K > 0 && !run.some(x => x.songs.includes(s)))
    out.newSince = [...new Set(run.flatMap(x => x.songs))].filter(s => !withSet.some(n => n.songs.includes(s)))
  }
  return out
}

// ── State ──
let S = { scenario: 'rich', step: 'before', planned: [], happened: null, answers: {}, order: null, extra: [], confirmed: false, photoTry: 0 }
const rec = () => buildRecord(S.scenario)
const TONIGHT = { date: '2026-10-30', city: 'Minneapolis', venue: 'First Avenue', time: '8:00 PM' }

function setScenario(k) { S = { ...S, scenario: k, step: 'before', planned: [], happened: null, answers: {}, order: null, extra: [], confirmed: false, photoTry: 0 }; render() }
function go(step) { S.step = step; render(); $('#screen').scrollIntoView({ block: 'nearest' }) }
['rich', 'low', 'gap'].forEach(k => $('#sc-' + k).onclick = () => setScenario(k))
;['before', 'after', 'confirm', 'reward'].forEach(k => $('#st-' + k).onclick = () => go(k))

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function songList(songs, mark) { return `<ol class="songs">${songs.map((s, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(s)}</span>${mark ? mark(s, i) : ''}</li>`).join('')}</ol>` }

// ── Screen: Before tonight ──
function beforeScreen() {
  const R = rec(), I = insights(R, TONIGHT.city)
  const lastNight = R[R.length - 1]
  let h = `<div><div class="eyebrow">Scheduled · Today · ${TONIGHT.time}</div><h2>${TONIGHT.venue}, ${TONIGHT.city}</h2></div>`
  if (!lastNight.setlist) h += `<div class="banner"><b>Last night at ${esc(lastNight.venue)}, ${esc(lastNight.city)} has no setlist on record.</b><span>Add the photo of the sheet, type the songs, or mark that it didn't happen. Until then, "not played lately" can't count past it.</span><div class="row2"><button class="opt">Add photo</button><button class="opt">Type songs</button><button class="opt">It didn't happen</button></div></div>`
  if (I.last) {
    const ago = Math.round((new Date(TONIGHT.date) - new Date(I.last.date)) / 864e5 / 30)
    h += `<div class="card"><h3>Your last set here</h3>
      <div class="sub">${fmt(I.last.date, true)} · ${esc(I.last.venue)} · ${I.last.songs.length} songs · ${ago} months ago</div>
      ${songList(I.last.songs, s => I.notSince.includes(s) ? `<span class="pill warn">not since</span>` : '')}
      ${I.last.order ? `<div class="sub">You opened with <b>${esc(I.last.songs[0])}</b> and closed with <b>${esc(I.last.songs[I.last.songs.length - 1])}</b>.</div>` : `<div class="basis">Order not confirmed for that night, so no opener or closer.</div>`}
      <details><summary>How we know</summary><div class="basis">${I.last.source === 'live' ? 'Live capture, confirmed by you' : 'Setlist photo, confirmed by you'}${I.last.order ? '; played order confirmed' : ''}. ${I.nights.length} night${I.nights.length > 1 ? 's' : ''} in ${I.city} on your record${I.nights.length > I.withSet.length ? `, ${I.nights.length - I.withSet.length} without a setlist` : ''}.</div></details></div>`
    const notSinceTxt = I.K === 0 ? `<div class="basis">Your most recent night has no setlist, so "not played since" isn't shown.</div>`
      : I.notSince.length ? `<div class="sub"><b>${I.notSince.map(esc).join(', ')}</b>: played here last time, and not in any of your last ${I.K} confirmed setlists.</div>` : ''
    const newSinceTxt = I.newSince && I.newSince.length ? (I.cityComplete
      ? `<div class="sub"><b>${I.newSince.slice(0, 4).map(esc).join(', ')}</b>: in your recent sets, never played in ${I.city} on your record.</div>`
      : `<div class="basis">${I.nights.length - I.withSet.length} night here has no setlist, so "never played here" isn't shown.</div>`) : ''
    h += `<div class="card"><h3>What's changed since</h3>${notSinceTxt}${newSinceTxt}${I.K ? `<div class="basis">Basis: your last ${I.K} confirmed setlists in a row${I.gaps ? `; ${I.gaps} night${I.gaps > 1 ? 's' : ''} on your record without a setlist` : ''}.</div>` : ''}</div>`
  } else {
    h += `<div class="card"><h3>${TONIGHT.city}</h3><div class="sub">No confirmed set in ${TONIGHT.city} on your record yet. Tonight's will be the first.</div>
      <div class="basis">Your record: ${I.total} confirmed show${I.total === 1 ? '' : 's'} since ${fmt(confirmed(R)[0].date, true)}.</div></div>`
    const last = confirmed(R).slice(-1)[0]
    h += `<div class="card"><h3>Your last set</h3><div class="sub">${fmt(last.date)} · ${esc(last.venue)}, ${esc(last.city)}</div>${songList(last.songs.slice(0, 6))}<div class="basis">+ ${last.songs.length - 6} more</div></div>`
    h += `<div class="card"><h3>Fill in your history</h3><div class="sub">Have photos of old setlist sheets? Add them. Each is read automatically, and you confirm it in about a minute.</div><button class="btn ghost">Add old setlist photos</button></div>`
  }
  // Practical: sketch tonight's planned set from evidence.
  const pool = [...new Set([...(I.last ? I.last.songs : []), ...gapFreeRun(R).slice(0, 3).flatMap(s => s.songs)])].slice(0, 14)
  const tag = s => {
    if (I.last && I.last.songs.includes(s)) return `played here ${new Date(I.last.date).getUTCFullYear()}`
    if (I.cityComplete || (!I.nights.length)) return `not played here on your record`
    return 'no full record here'
  }
  h += `<div class="card"><h3>Sketch tonight's set</h3><div class="sub">Tap songs in the order you'd play them. This makes a <b>planned</b> set; only what you confirm after the show goes on your record.</div>
    <div class="chips">${pool.map(s => `<button class="chip" aria-pressed="${S.planned.includes(s)}" data-song="${esc(s)}"><span>${S.planned.includes(s) ? (S.planned.indexOf(s) + 1) + '. ' : ''}${esc(s)}</span><small>${tag(s)}</small></button>`).join('')}</div>
    ${S.planned.length ? `<div class="row2"><button class="btn" id="savePlan">Save planned set (${S.planned.length})</button></div><div id="planMsg"></div>` : ''}</div>`
  $('#screen').innerHTML = h
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { const s = b.dataset.song; S.planned = S.planned.includes(s) ? S.planned.filter(x => x !== s) : [...S.planned, s]; beforeScreen() })
  const sp = $('#savePlan'); if (sp) sp.onclick = () => { $('#planMsg').innerHTML = `<div class="toast">Saved as tonight's planned set. It shows as "planned", never as played.</div>` }
}

// ── Screen: After the show (photo) ──
function draftFor() { return S.scenario === 'gap' ? (S.photoTry === 0 ? DATA.drafts.unreadable : DATA.drafts.retake) : DATA.drafts.main }
function afterScreen() {
  const d = draftFor()
  let h = `<div><div class="eyebrow">After the show · 11:42 PM</div><h2>${TONIGHT.venue}</h2></div>
    <button class="tonight" id="addPhoto"><span class="dot"></span><span style="flex:1"><b>Add tonight's setlist photo</b><br><span class="sub">The sheet you played from, marks and all</span></span><span class="pill gold">Add</span></button>`
  $('#screen').innerHTML = h + `<div id="photoArea"></div>`
  $('#addPhoto').onclick = () => {
    $('#photoArea').innerHTML = `<div class="card"><div class="photo"><img alt="Setlist photo from the benchmark set" src="${d.image}">${reduced ? '' : '<div class="scan"></div>'}</div><div class="sub" id="readMsg">Reading the sheet…</div></div>`
    setTimeout(() => {
      if (!d.readable) {
        $('#readMsg').innerHTML = `<div class="banner"><b>Couldn't read this photo.</b><span>It's too dark to read. Retake it, ideally with the sheet flat and some light, or type the songs.</span><div class="row2"><button class="opt" id="retake">Retake photo</button><button class="opt">Type the songs</button></div><span class="basis">This attempt: ${d.attempts} automatic tr${d.attempts > 1 ? 'ies' : 'y'}, ${d.ms ? (d.ms / 1000).toFixed(1) + ' s' : '—'}.</span></div>`
        $('#retake').onclick = () => { S.photoTry = 1; afterScreen(); $('#addPhoto').click() }
      } else {
        $('#readMsg').innerHTML = `Read ${d.lines.length} lines in ${(d.ms / 1000).toFixed(1)} s. <b>${countQuestions(d)} things to check.</b>`
        $('#photoArea').insertAdjacentHTML('beforeend', `<button class="btn" id="toConfirm">Review and confirm</button>`)
        $('#toConfirm').onclick = () => go('confirm')
      }
    }, reduced ? 50 : 1300)
  }
}

// ── Screen: Confirm ──
function questionsFor(d) {
  const qs = []
  d.lines.forEach((l, i) => {
    if (l.mark === 'crossed') qs.push({ id: 'x' + i, line: i, text: `<b>${esc(l.text)}</b> is crossed out on the sheet. Did you play it?`, opts: [['no', 'Not played'], ['yes', 'Played']], def: 'no' })
    else if (l.mark === 'added') qs.push({ id: 'a' + i, line: i, text: `<b>${esc(l.text)}</b> was added by hand. Did you play it?`, opts: [['yes', 'Played'], ['no', 'Not played']] })
    if (l.legibility && l.legibility !== 'clear' && l.mark !== 'crossed') qs.push({ id: 'l' + i, line: i, text: `Line ${i + 1} is hard to read: "${esc(l.text || '…')}". Is that right?`, opts: [['yes', 'Yes'], ['fix', 'Type it']] })
    if (l.mark !== 'crossed') l.match.forEach((m, k) => {
      if (m.flag === 'new_song') qs.push({ id: 'n' + i + k, line: i, text: `<b>${esc(m.text)}</b> isn't in your songs. Add it as a new song?`, opts: [['new', 'New song'], ['pick', 'Pick a song']] })
      else if (m.flag === 'ambiguous') qs.push({ id: 'm' + i + k, line: i, text: `"${esc(m.text)}": which one?`, opts: (m.alts || []).map(a => [a.id, a.label]) })
      else if (m.flag === 'weak') qs.push({ id: 'w' + i + k, line: i, text: `"${esc(m.text)}" → <b>${esc(m.title)}</b>?`, opts: [['yes', 'Yes'], ['pick', 'Pick another']] })
    })
  })
  return qs
}
function countQuestions(d) { return questionsFor(d).length + 2 }
function confirmScreen() {
  const d = draftFor()
  if (!d.readable) { $('#screen').innerHTML = `<div class="card"><div class="sub">No draft yet. Add a readable photo first.</div><button class="btn ghost" id="back">Back to the photo</button></div>`; $('#back').onclick = () => go('after'); return }
  const qs = questionsFor(d)
  const answered = qs.filter(q => S.answers[q.id] || q.def).length
  const ready = S.happened === 'yes' && S.order && answered === qs.length
  const played = d.lines.flatMap((l, i) => {
    if (l.mark === 'crossed' && (S.answers['x' + i] || 'no') === 'no') return []
    if (l.mark === 'added' && S.answers['a' + i] === 'no') return []
    return l.match.map(m => { const pick = S.answers['m' + i + l.match.indexOf(m)]; const alt = pick && (m.alts || []).find(a => a.id === pick); return alt ? alt.title : (m.title || m.text) })
  }).concat(S.extra)
  let h = `<div><div class="eyebrow">Confirm last night</div><h2>${TONIGHT.venue}</h2><p class="sub">${fmt(TONIGHT.date)} · ${TONIGHT.time} · ${qs.length + 2} quick questions</p></div>
  <div class="q ${S.happened ? 'done' : ''}"><p><b>Did this show happen?</b> A booking or a photo isn't proof on its own.</p><div class="row2">${[['yes', 'Yes, we played'], ['no', "No, it didn't happen"]].map(([v, t]) => `<button class="opt" data-h="${v}" aria-pressed="${S.happened === v}">${t}</button>`).join('')}</div></div>`
  if (S.happened === 'no') { $('#screen').innerHTML = h + `<div class="card"><div class="sub">The booking will be marked as not played. Nothing is added to your record.</div><button class="btn ghost" id="undoNo">Undo</button></div>`; wireConfirm(); $('#undoNo').onclick = () => { S.happened = null; confirmScreen() }; return }
  h += qs.map(q => `<div class="q ${S.answers[q.id] || q.def ? 'done' : ''}"><p>${q.text}</p><div class="row2">${q.opts.map(([v, t]) => `<button class="opt" data-q="${q.id}" data-v="${esc(v)}" aria-pressed="${(S.answers[q.id] || q.def) === v}">${esc(t)}</button>`).join('')}</div></div>`).join('')
  h += `<div class="q ${S.order ? 'done' : ''}"><p><b>Played in this order?</b> The sheet's order is the plan; your answer makes opener and closer claims possible.</p><div class="row2">${[['yes', 'Yes, this order'], ['unsure', 'Not sure']].map(([v, t]) => `<button class="opt" data-o="${v}" aria-pressed="${S.order === v}">${t}</button>`).join('')}</div></div>`
  h += `<div class="card"><h3>Your setlist · ${played.length} songs</h3>${songList(played)}<button class="opt" id="addExtra">+ A song that isn't on the sheet</button></div>
    <button class="btn" id="doConfirm" ${ready ? '' : 'disabled'}>${ready ? `Confirm ${played.length} songs` : `Answer ${qs.length + 2 - answered - (S.happened ? 1 : 0) - (S.order ? 1 : 0)} more`}</button>
    <div class="basis">Read from the photo by the benchmark's candidate pipeline: ${d.flagNote}</div>`
  $('#screen').innerHTML = h; wireConfirm()
  $('#addExtra').onclick = () => { if (!S.extra.includes('Hallelujah')) S.extra.push('Hallelujah'); confirmScreen() }  // example: an unlisted encore
  $('#doConfirm').onclick = () => { if (!ready) return; S.confirmed = { played, order: S.order === 'yes' }; go('reward') }
}
function wireConfirm() {
  document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { S.happened = b.dataset.h; confirmScreen() })
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { S.answers[b.dataset.q] = b.dataset.v; confirmScreen() })
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { S.order = b.dataset.o; confirmScreen() })
}

// ── Screen: Your record (the reward) ──
function rewardScreen() {
  if (!S.confirmed) { $('#screen').innerHTML = `<div class="card"><div class="sub">Confirm last night first. Your record only changes when you do.</div><button class="btn ghost" id="b">Go to Confirm</button></div>`; $('#b').onclick = () => go(draftFor().readable ? 'confirm' : 'after'); return }
  const R = rec(), before = confirmed(R), I = insights(R, TONIGHT.city)
  const now = { date: TONIGHT.date, city: TONIGHT.city, venue: TONIGHT.venue, songs: S.confirmed.played, order: S.confirmed.order, setlist: true }
  const R2 = [...R, now], run = gapFreeRun(R)
  const disc = []
  // Returned after N shows: needs a gap-free run back to the previous play.
  for (const s of now.songs) {
    const idx = run.findIndex(x => x.songs.includes(s))
    if (idx >= 4) { disc.push({ t: `<b>${esc(s)}</b> came back after ${idx} shows.`, basis: `Not in your ${idx} confirmed setlists before tonight, with no gaps in that run.` }); break }
  }
  const everPlayed = new Set(before.flatMap(x => x.songs))
  const debut = now.songs.find(s => !everPlayed.has(s))
  if (debut) disc.push({ t: `<b>${esc(debut)}</b>: first time on your record.`, basis: `In none of your ${before.length} confirmed setlists${R.length > before.length ? `. ${R.length - before.length} night${R.length - before.length > 1 ? 's have' : ' has'} no setlist, so "first time ever" isn't claimed` : ''}.`, card: 'Song debut card' })
  if (S.confirmed.order && I.last && I.last.order) {
    const close = now.songs[now.songs.length - 1]
    disc.push({ t: close === I.last.songs[I.last.songs.length - 1] ? `You closed with <b>${esc(close)}</b> again, like last time here.` : `You closed with <b>${esc(close)}</b>. Last time here, it was <b>${esc(I.last.songs[I.last.songs.length - 1])}</b>.`, basis: 'Both nights have a confirmed played order.' })
  } else if (!S.confirmed.order) disc.push({ t: `Opener and closer aren't shown.`, basis: `You answered "Not sure" to the played order, so position claims stay off.`, quiet: true })
  if (!I.last && I.cityComplete === false && !I.nights.length) disc.push({ t: `Your first show in ${TONIGHT.city} on your record.`, basis: `No earlier ${TONIGHT.city} nights on your record.` })
  const total = before.length + 1
  const runNights = S.scenario === 'low' ? [] : RUN_DATES.map(dt => R.find(x => x.date === dt))
  let h = `<div><div class="eyebrow">Show complete</div><h2>${TONIGHT.venue}, ${TONIGHT.city}</h2></div>
    <div class="card record"><h3>Your record</h3><div style="display:flex;gap:10px;align-items:baseline"><span class="count" id="count">${total - 1}</span><span class="sub">confirmed shows</span></div>
      <div class="dots" id="dots">${R.map(x => `<i class="${x.setlist ? '' : 'gap'}" title="${x.setlist ? '' : 'No setlist on record'}"></i>`).join('')}<i class="new" id="newdot" style="opacity:${reduced ? 1 : 0}"></i></div>
      ${R.length > before.length ? `<div class="basis">Dashed: ${R.length - before.length} night${R.length - before.length > 1 ? 's' : ''} with no setlist on record. They stay visible until someone adds one.</div>` : ''}</div>
    <div class="card" id="discs" style="${reduced ? '' : 'opacity:0;transition:opacity .4s'}"><h3>Last night, on your record</h3>
      ${disc.slice(0, 3).map(x => `<div class="disc"><span${x.quiet ? ' class="sub"' : ''}>${x.t}</span><details><summary>How we know</summary><div class="basis">${x.basis}</div></details>${x.card ? `<div><button class="opt">${x.card}</button></div>` : ''}</div>`).join('')}</div>`
  if (runNights.length) h += `<div class="card"><h3>Fall run</h3><div class="tour">${runNights.map(x => `<div class="night ${x.setlist ? '' : 'gap'}"><span>${fmt(x.date)}</span><b>${esc(x.city)}</b><span>${x.setlist ? x.songs.length + ' songs' : 'No setlist'}</span></div>`).join('')}<div class="night now"><span>${fmt(TONIGHT.date)}</span><b>${TONIGHT.city}</b><span>${now.songs.length} songs</span></div><div class="night next"><span>Oct 31</span><b>Milwaukee</b><span>Next</span></div></div>
    <div class="basis">A night with no setlist stays a gap. It's never filled with the planned set.</div></div>`
  h += `<div class="card"><h3>Next</h3><div class="sub">Tomorrow: Pabst Theater, Milwaukee. <b>Before tonight</b> will have your last set there.</div>
    <div class="basis">This show's ${now.songs.length} songs are on the record for Prepare, where you choose what to file and with which PRO. Setlistr doesn't file for you.</div></div>`
  $('#screen').innerHTML = h
  // The shipped celebration's language: the gold orb breathes, travels to the new dot and becomes it.
  if (!reduced) {
    const orb = $('#orb'), btnR = $('#screen').getBoundingClientRect(), dot = $('#newdot').getBoundingClientRect()
    const fx = btnR.left + btnR.width / 2 - 55, fy = Math.min(window.innerHeight * 0.55, btnR.top + 320)
    orb.animate([{ opacity: 0, transform: `translate(${fx}px,${fy}px) scale(.9)` }, { opacity: 1, transform: `translate(${fx}px,${fy}px) scale(1.04)`, offset: .3 }, { opacity: 1, transform: `translate(${dot.left - 50}px,${dot.top - 50}px) scale(.09)` }], { duration: 950, easing: 'cubic-bezier(.55,0,.25,1)', fill: 'forwards' }).onfinish = () => {
      orb.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' }); $('#newdot').style.opacity = 1; $('#count').textContent = total; $('#count').classList.add('flash'); $('#discs').style.opacity = 1
    }
  } else $('#count').textContent = total
}

const NOTES = {
  before: `<h3>Before tonight</h3><ul><li><b>Practical value:</b> the last set here, what's dropped out since, and a planned-set sketch with each song's evidence.</li><li>Opener and closer appear only when that night's played order was confirmed.</li><li>"Never played here" appears only when every night in that city has a setlist. "Not since" counts only an unbroken run of confirmed setlists.</li><li><b>Hypothesis, not finding:</b> that artists open this on show days.</li></ul>`,
  after: `<h3>After the show</h3><ul><li>One photo of the sheet already in use. The reading shown is the benchmark's actual output for this image.</li><li>Unreadable photos fail plainly: retake or type, with no staff queue. The "Missing evidence" scenario uses a real unreadable benchmark photo and its retake.</li></ul>`,
  confirm: `<h3>Confirm</h3><ul><li>"Did this show happen?" always comes first. A booking or photo isn't proof.</li><li>Only flagged lines ask a question: crossed out, added by hand, hard to read, a new song, or an ambiguous title. Everything else is pre-filled.</li><li>"Played in this order?" decides whether position claims are allowed.</li><li>Off-paper changes (an unlisted song, an unmarked skip) can only come from the person confirming.</li></ul>`,
  reward: `<h3>Your record</h3><ul><li>The shipped celebration's motion: the orb lands as a new dot on the record.</li><li>At most three discoveries, each with its basis. None are generated by AI text; all are computed from confirmed nights.</li><li>Gaps stay visible in the run. Prepare is offered, and filing stays the artist's.</li><li>No royalty figures.</li></ul>`,
}
function render() {
  ['rich', 'low', 'gap'].forEach(k => $('#sc-' + k).setAttribute('aria-pressed', S.scenario === k))
  ;['before', 'after', 'confirm', 'reward'].forEach(k => S.step === k ? $('#st-' + k).setAttribute('aria-current', 'step') : $('#st-' + k).removeAttribute('aria-current'))
  ;({ before: beforeScreen, after: afterScreen, confirm: confirmScreen, reward: rewardScreen })[S.step]()
  $('#notes').innerHTML = NOTES[S.step] + `<p class="src">${DATA.benchNote}</p>`
}
render()
</script>
